<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWATCH | Netflix Style AI</title>
    <style>
        :root { --main-red: #e50914; --dark-bg: #141414; --card-bg: #1f1f1f; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 0; }
        
        /* Navbar */
        nav { background: rgba(0,0,0,0.8); padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--main-red); font-size: 2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }

        /* Auth Section */
        #auth-section { display: flex; justify-content: center; align-items: center; height: 80vh; }
        .auth-card { background: rgba(0,0,0,0.75); padding: 60px; border-radius: 8px; width: 400px; text-align: left; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn-red { width: 100%; padding: 15px; background: var(--main-red); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; }

        /* Main Content (Skryté pred prihlásením) */
        #main-content { display: none; padding: 50px; }
        .hero { height: 60vh; background: linear-gradient(to top, var(--dark-bg), transparent), url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); background-size: cover; display: flex; align-items: flex-end; padding-bottom: 50px; margin-bottom: 40px; }
        
        .upload-section { background: var(--card-bg); padding: 30px; border-radius: 10px; margin-bottom: 40px; border: 1px solid #333; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; transition: transform 0.3s; cursor: pointer; }
        .video-card:hover { transform: scale(1.05); }
        .video-card video { width: 100%; aspect-ratio: 16/9; background: black; }
        .video-info { padding: 15px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">RWATCH</div>
    <div id="user-info"></div>
</nav>

<div id="auth-section">
    <div class="auth-card">
        <h2>Registrácia</h2>
        <input type="text" id="reg-name" placeholder="Meno">
        <input type="email" id="reg-email" placeholder="E-mail">
        <input type="password" id="reg-pass" placeholder="Heslo">
        <button class="btn-red" onclick="handleSignUp()">Zaregistrovať sa a vstúpiť</button>
    </div>
</div>

<div id="main-content">
    <div class="hero">
        <div>
            <h1>AI Cinematic World</h1>
            <p>Nahrávaj a sleduj svoje AI výtvory bez limitov.</p>
        </div>
    </div>

    <div class="upload-section">
        <h3>Nahrať nové video</h3>
        <input type="text" id="v-title" placeholder="Názov videa">
        <input type="file" id="v-file" accept="video/*" style="background: none;">
        <button class="btn-red" id="upload-btn" onclick="uploadVideo()">Nahrať na server</button>
        <p id="up-status" style="font-size: 0.8rem; color: #aaa; margin-top: 10px;"></p>
    </div>

    <h3>Tvoja knižnica</h3>
    <div class="video-grid" id="library">
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA8yGIMeU_rDhy8tX3BMCCyfHR_e_P2QRI",
        authDomain: "rwatch-d6976.firebaseapp.com",
        projectId: "rwatch-d6976",
        storageBucket: "rwatch-d6976.firebasestorage.app",
        messagingSenderId: "1070516345809",
        appId: "1:1070516345809:web:9de4a1f86d8c0ea98c9ef0",
        measurementId: "G-7WBF55BQ19"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. REGISTRÁCIA
    window.handleSignUp = async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;

        if(!name || !email || !pass) { alert("Vyplň všetko!"); return; }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            await updateProfile(userCredential.user, { displayName: name });
            
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-info').innerText = "Ahoj, " + name;
            loadVideos();
        } catch (error) {
            alert("Chyba: " + error.message);
        }
    };

    // 2. NAHRÁVANIE VIDEA (Simulované cez Firestore)
    window.uploadVideo = async () => {
        const title = document.getElementById('v-title').value;
        const file = document.getElementById('v-file').files[0];
        const status = document.getElementById('up-status');

        if(!title || !file) { alert("Vyber video a zadaj názov!"); return; }

        status.innerText = "Nahrávam dáta do RWATCH databázy...";
        
        try {
            // V reálnom svete by tu bol Firebase Storage, 
            // nateraz simulujeme pridanie "záznamu" do knižnice
            await addDoc(collection(db, "videos"), {
                title: title,
                user: auth.currentUser.displayName,
                timestamp: new Date()
            });

            status.innerText = "Video úspešne pridané do tvojho Netflix listu!";
            setTimeout(() => { location.reload(); }, 1500);
        } catch (e) {
            console.error("Error: ", e);
        }
    };

    // 3. NAČÍTANIE KNIŽNICE
    async function loadVideos() {
        const querySnapshot = await getDocs(collection(db, "videos"));
        const library = document.getElementById('library');
        
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const card = `
                <div class="video-card">
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
                    <div class="video-info">
                        <strong>${data.title}</strong><br>
                        <small>Pridal: ${data.user}</small>
                    </div>
                </div>
            `;
            library.innerHTML += card;
        });
    }
</script>
</body>
</html>
