<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cinematic Video Generator | RWATCH</title>
    <style>
        :root { --primary: #6366f1; --bg: #0b0f1a; --card: #161b2c; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-card { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #2d3748; text-align: center; }
        
        h2 { margin-bottom: 20px; font-weight: 600; color: #fff; }
        label { display: block; text-align: left; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        
        textarea, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; 
            background: #1e293b; color: white; margin-bottom: 20px; box-sizing: border-box;
        }

        .btn-generate { 
            width: 100%; padding: 15px; border: none; border-radius: 10px; 
            background: linear-gradient(90deg, #6366f1, #a855f7); color: white; 
            font-weight: bold; cursor: pointer; transition: transform 0.2s;
        }
        .btn-generate:active { transform: scale(0.98); }

        .progress-container { display: none; margin-top: 25px; }
        .bar-bg { width: 100%; background: #334155; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        .status-text { font-size: 0.8rem; margin-top: 8px; color: #94a3b8; }

        #video-player { display: none; margin-top: 25px; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="app-card">
    <h2>RWATCH AI Video</h2>
    
    <label>Popis scény (AI Prompt)</label>
    <textarea id="prompt" placeholder="Napr. Realistický záber na nočný New York v roku 2077..."></textarea>

    <label>Dĺžka videa</label>
    <select id="duration">
        <option value="60">1 Minúta</option>
        <option value="300">5 Minút</option>
        <option value="3600">1 Hodina</option>
    </select>

    <button class="btn-generate" onclick="startGeneration()">Spustiť AI renderovanie</button>

    <div class="progress-container" id="progress-box">
        <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
        <div class="status-text" id="status">Pripravujem Firebase prostredie...</div>
    </div>

    <video id="video-player" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
</div>

<script>
    function startGeneration() {
        const prompt = document.getElementById('prompt').value;
        if(!prompt) { alert("Zadaj popis!"); return; }

        document.getElementById('progress-box').style.display = "block";
        document.getElementById('video-player').style.display = "none";
        
        let progress = 0;
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');

        const interval = setInterval(() => {
            progress += 2;
            bar.style.width = progress + "%";
            if(progress < 50) status.innerText = "Komunikujem s Firebase a AI serverom...";
            else if(progress < 90) status.innerText = "Spracovávam video dáta...";
            else if(progress >= 100) {
                clearInterval(interval);
                status.innerText = "Hotovo!";
                document.getElementById('video-player').style.display = "block";
            }
        }, 100);
    }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA8yGIMeU_rDhy8tX3BMCCyfHR_e_P2QRI",
    authDomain: "rwatch-d6976.firebaseapp.com",
    projectId: "rwatch-d6976",
    storageBucket: "rwatch-d6976.firebasestorage.app",
    messagingSenderId: "1070516345809",
    appId: "1:1070516345809:web:9de4a1f86d8c0ea98c9ef0",
    measurementId: "G-7WBF55BQ19"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  
  console.log("Firebase úspešne prepojený s RWATCH projektom!");
</script>

</body>
</html>
