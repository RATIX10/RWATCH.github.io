<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="p-5 bg-gray-800 shadow-xl mb-10">
        <h1 class="text-2xl font-bold text-center text-blue-500">Video Server</h1>
    </nav>

    <div class="max-w-5xl mx-auto px-4">
        <div class="bg-blue-900/30 border border-blue-500 p-4 rounded mb-8 text-sm">
            <strong>Tip:</strong> Ak chceš, aby videá videli všetci na GitHube, musíš ich nahrať do svojho repozitára a pridať ich do HTML kódu nižšie v sekcii "Zoznam videí".
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                <video controls class="w-full">
                    <source src="videa/video1.mp4" type="video/mp4">
                    Váš prehliadač nepodporuje video.
                </video>
                <div class="p-4">
                    <h3 class="font-bold">Prvé video</h3>
                    <a href="videa/video1.mp4" download class="mt-3 block text-center bg-blue-600 hover:bg-blue-700 py-2 rounded text-sm transition">
                        Stiahnuť video
                    </a>
                </div>
            </div>

            </div>
    </div>

</body>
</html>
