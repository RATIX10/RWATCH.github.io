<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream platforma (Firebase + Cloudinary)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; }
        button { background: #00b894; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #55efc4; }
        video { width: 100%; border-radius: 6px; background: #000; margin-top: 10px; }
        .hidden { display: none; }
        .video-list { text-align: left; margin-top: 20px; padding: 15px; background: #2d3436; border-radius: 6px; max-height: 400px; overflow-y: auto; }
        .video-item { background: #1e1e1e; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section">
        <h2>Vstup do Kanálu</h2>
        <input type="text" id="channel-name" placeholder="Názov kanálu" required>
        <input type="password" id="channel-password" placeholder="Heslo" required>
        <button id="btn-login">Prihlásiť / Vytvoriť kanál</button>
    </div>

    <div id="main-section" class="hidden">
        <h2 id="welcome-msg">Kanál: </h2>
        <button id="btn-logout" style="background: #d63031;">Odhlásiť sa</button>
        
        <hr style="border-color: #444;">
        
        <h3>Nahrávanie videa</h3>
        <video id="preview" autoplay muted playsinline></video>
        <button id="btn-start-record">🔴 Spustiť nahrávanie</button>
        <button id="btn-stop-record" class="hidden" style="background: #0984e3;">⏹️ Zastaviť a odoslať</button>

        <hr style="border-color: #444;">

        <h3>Archív videí</h3>
        <div id="video-container" class="video-list">Načítavam...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. SEM VLOŽ SVOJ FIREBASE KONFIGURAČNÝ KÓD
    const firebaseConfig = {
        apiKey: "TVOJA_API_KEY",
        authDomain: "TVOJ_PROJECT_ID.firebaseapp.com",
        projectId: "TVOJ_PROJECT_ID",
        storageBucket: "TVOJ_PROJECT_ID.appspot.com",
        messagingSenderId: "TVOJE_ID",
        appId: "TVOJE_APP_ID"
    };

    // 2. SEM VLOŽ SVOJE ÚDAJE Z CLOUDINARY
    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/daw1tgk1j/video/upload";
    const CLOUDINARY_PRESET = "RWATCH"; // Musí byť nastavený ako "Unsigned"

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dom elementy
    const authSection = document.getElementById('auth-section');
    const mainSection = document.getElementById('main-section');
    const channelNameInput = document.getElementById('channel-name');
    const channelPasswordInput = document.getElementById('channel-password');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const welcomeMsg = document.getElementById('welcome-msg');
    const previewVideo = document.getElementById('preview');
    const btnStartRecord = document.getElementById('btn-start-record');
    const btnStopRecord = document.getElementById('btn-stop-record');
    const videoContainer = document.getElementById('video-container');

    let currentChannel = null;
    let mediaRecorder;
    let recordedChunks = [];
    let cameraStream;

    // LOGIN SYSTÉM (Cez Firebase Firestore)
    btnLogin.addEventListener('click', async () => {
        const channel = channelNameInput.value.trim().toLowerCase();
        const password = channelPasswordInput.value.trim();

        if(!channel || !password) return alert('Vyplň údaje!');

        const docRef = doc(db, "channels", channel);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            if (docSnap.data().password === password) {
                loginSuccess(channel, docSnap.data().videos || []);
            } else {
                alert('Nesprávne heslo!');
            }
        } else {
            await setDoc(docRef, { password: password, videos: [] });
            alert('Nový kanál vytvorený!');
            loginSuccess(channel, []);
        }
    });

    function loginSuccess(channel, videos) {
        currentChannel = channel;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        welcomeMsg.innerText = "Kanál: " + channel.toUpperCase();
        loadVideos(videos);
        initCamera();
    }

    btnLogout.addEventListener('click', () => {
        currentChannel = null;
        if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
    });

    async function initCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            previewVideo.srcObject = cameraStream;
        } catch (e) { alert('Kamera nedostupná.'); }
    }

    // NAHRÁVANIE A ODOSIELANIE
    btnStartRecord.addEventListener('click', () => {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(cameraStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
        
        mediaRecorder.onstop = async () => {
            videoContainer.innerHTML = "<i>Odosielam video do cloudu... Čakaj...</i>";
            const blob = new Blob(recordedChunks, { type: 'video/webm' });

            // Príprava dát pre Cloudinary (odosiela sa ako formulár)
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', CLOUDINARY_PRESET);

            try {
                // 1. Nahranie videa na Cloudinary
                const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await res.json();

                if(data.secure_url) {
                    // 2. Uloženie odkazu do Firebase Firestore
                    const videoData = {
                        timestamp: new Date().toLocaleString(),
                        videoUrl: data.secure_url
                    };
                    const docRef = doc(db, "channels", currentChannel);
                    await updateDoc(docRef, { videos: arrayUnion(videoData) });

                    alert('Video úspešne uložené!');
                    const updatedSnap = await getDoc(docRef);
                    loadVideos(updatedSnap.data().videos);
                } else {
                    throw new Error('Chyba cloudu');
                }
            } catch (err) {
                alert('Nahrávanie zlyhalo. Skontroluj nastavenia Cloudinary.');
                console.error(err);
            }
        };

        mediaRecorder.start();
        btnStartRecord.classList.add('hidden');
        btnStopRecord.classList.remove('hidden');
    });

    btnStopRecord.addEventListener('click', () => {
        mediaRecorder.stop();
        btnStartRecord.classList.remove('hidden');
        btnStopRecord.classList.add('hidden');
    });

    function loadVideos(videos) {
        videoContainer.innerHTML = videos.length === 0 ? 'Žiadne videá.' : '';
        [...videos].reverse().forEach(vid => {
            const div = document.createElement('div');
            div.className = 'video-item';
            div.innerHTML = `Subor z: ${vid.timestamp}<br><video src="${vid.videoUrl}" controls></video>`;
            videoContainer.appendChild(div);
        });
    }
</script>
</body>
</html>
